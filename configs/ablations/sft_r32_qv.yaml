model:
  model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"
  trust_remote_code: true
  use_4bit: false
  torch_dtype: "bfloat16"

data:
  train_file: "data/processed/sft_train.jsonl"
  eval_file: "data/processed/sft_eval.jsonl"
  text_field: "text"
  prompt_template: "chat"
  max_seq_length: 1024
  packing: false

training:
  output_dir: "outputs/ablations/sft_r32_qv"
  num_train_epochs: 1
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  logging_steps: 5
  eval_strategy: "steps"
  eval_steps: 20
  save_strategy: "steps"
  save_steps: 20
  save_total_limit: 2
  report_to: "none"
  seed: 42

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "v_proj"
