model:
  model_name_or_path: "Qwen/Qwen2.5-7B-Instruct"
  trust_remote_code: true
  use_4bit: false
  torch_dtype: "bfloat16"

data:
  train_file: "data/processed/sft_train.jsonl"
  eval_file: "data/processed/sft_eval.jsonl"
  text_field: "text"
  prompt_template: "chat"
  max_seq_length: 1024
  packing: false

training:
  output_dir: "outputs/final_sft_7b"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  logging_steps: 5
  eval_strategy: "steps"
  eval_steps: 20
  save_strategy: "steps"
  save_steps: 20
  save_total_limit: 2
  gradient_checkpointing: true
  report_to: "none"
  seed: 42

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

note: "SFT 7B: Qwen2.5-7B-Instruct, LoRA r=32 attn+MLP, 1 epoch. Same data and LoRA config as 1.5B. Effective batch size=8 (train_batch=2 x accum=4)."
